name: Build TargetKu APK

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: 'Apa yang baru? (Changelog)'
        required: true
        default: '- Perbaikan bug dan peningkatan performa'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Siapkan Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version=8.7

      - name: Beri Izin Eksekusi Gradle
        run: chmod +x gradlew

      - name: Set Version
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: Generate Release Keystore
        run: |
          keytool -genkey -v \
            -keystore targetku-release.jks \
            -alias targetku \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=TargetKu Dev, OU=RizkiDev, O=TargetKu, L=Indonesia, S=Riau, C=ID" \
            -storepass targetku2024 \
            -keypass targetku2024

      - name: Build Release APK
        env:
          VERSION_CODE: ${{ env.VERSION_CODE }}
          VERSION_NAME: ${{ env.VERSION_NAME }}
          KEYSTORE_PATH: targetku-release.jks
          STORE_PASSWORD: targetku2024
          KEY_ALIAS: targetku
          KEY_PASSWORD: targetku2024
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          NAMA_FILE="TargetKu_v${{ env.VERSION_NAME }}_b${{ env.VERSION_CODE }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAMA_FILE"
          echo "APK_PATH=$NAMA_FILE" >> $GITHUB_ENV
          echo "APK_NAME=$NAMA_FILE" >> $GITHUB_ENV

      - name: Kirim APK ke Telegram
        run: |
          cat << 'EOF' > caption.txt
          🎯 *TargetKu UPDATE TERSEDIA!*
          
          *Versi:* ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
          
          *Changelog:*
          ${{ github.event.inputs.changelog }}
          
          *Fitur:*
          - Login Demo (rizkibismillahsnu/130310)
          - Onboarding 6 langkah
          - Tracker Akademik + Export PDF/Excel
          - Jadwal + Strict Alarm + Kamera
          - AI Tutor Kiku
          - Profil lengkap
          EOF
          
          PESAN=$(cat caption.txt)

          for ID in 8083070985 7520038758; do
            curl -F document=@"${{ env.APK_PATH }}" \
                 -F caption="$PESAN" \
                 -F parse_mode="Markdown" \
                 "https://api.telegram.org/bot8825507034:AAHKGjBB6um-i0BWhz1USKQcITKqF-dGhDs/sendDocument?chat_id=$ID" || true
          done

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "targetku-v${{ env.VERSION_CODE }}"
          name: "TargetKu v${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})"
          body: |
            ## TargetKu - Personal Study Planner & Scholarship Tracker

            **Versi:** ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})

            ### Changelog
            ${{ github.event.inputs.changelog }}

            ### Cara Install
            1. Download file APK di bawah
            2. Aktifkan "Install dari sumber tidak dikenal" di pengaturan HP
            3. Install dan buka TargetKu
            4. Login dengan: **rizkibismillahsnu** / **130310**

            ### Fitur Utama
            - Login Demo
            - Onboarding 6 langkah (pencarian universitas live API)
            - Dashboard dengan motivasi harian & catatan cepat
            - Tracker Akademik dengan export PDF & Excel
            - Jadwal Belajar dengan Strict Alarm & verifikasi kamera
            - AI Tutor "Kiku" dengan Gemini API
            - Profil lengkap dengan edit personalisasi
          files: "${{ env.APK_PATH }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
